{
  "name": "Recover verified publication",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/recover-publication.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "newsletter-podcast",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "if": "vars.PUBLISH_TO_PAGES == 'true'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "steps": [
        {
          "name": "Download this run's immutable public bundle",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "11780795095",
            "run-id": "38324045259",
            "github-token": "${{ github.token }}",
            "path": "incoming",
            "merge-multiple": true
          }
        },
        {
          "name": "Verify digest and public asset allowlist",
          "env": {
            "EXPECTED_SHA256": "7a59e9853f454be4505d4572a7afad050c854c3f84657d07020630cc5d553155"
          },
          "run": "python3 -I - <<'PYVERIFY'\nimport hashlib, os, re, tarfile\nfrom pathlib import Path\narchive = Path('incoming/podcast-public.tar')\nexpected = os.environ['EXPECTED_SHA256']\nif not re.fullmatch(r'[0-9a-f]{64}', expected):\n    raise ValueError('Invalid bundle digest')\nwith archive.open('rb') as source:\n    if hashlib.file_digest(source, 'sha256').hexdigest() != expected:\n        raise ValueError('Public bundle digest mismatch')\nhead = Path('incoming/published-head.txt').read_text()\nif head and not re.fullmatch(r'[0-9a-f]{40}', head):\n    raise ValueError('Invalid previous publication revision')\nrequired = {'feed.xml', 'index.html', 'favicon.svg', 'podcast-state.enc', 'demo/sample.mp3'}\nseen = set()\ndestination = Path('publish')\ndestination.mkdir()\nwith tarfile.open(archive, 'r:') as bundle:\n    for member in bundle:\n        name = member.name\n        allowed = name in required or re.fullmatch(r'episodes/[A-Za-z0-9][A-Za-z0-9._-]{0,250}\\.mp3', name)\n        if not allowed or not member.isfile() or name in seen:\n            raise ValueError('Unexpected public bundle member')\n        seen.add(name)\n    if not required <= seen:\n        raise ValueError('Public bundle is incomplete')\n    bundle.extractall(destination, filter='data')\nprint('Verified public bundle; no executable or private state files accepted.')\nPYVERIFY\n"
        },
        {
          "name": "Publish explicitly public feed to gh-pages",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "REPOSITORY": "${{ github.repository }}"
          },
          "run": "set -euo pipefail\npublished_head=$(cat incoming/published-head.txt)\ncd publish\ngit init -q -b gh-pages\ntouch .nojekyll\ngit add --all .\ngit -c user.name=\"github-actions\" -c user.email=\"github-actions@users.noreply.github.com\" commit -qm \"Publish podcast\"\ngit push \"--force-with-lease=refs/heads/gh-pages:${published_head}\" \"https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git\" gh-pages\n"
        }
      ]
    }
  }
}
