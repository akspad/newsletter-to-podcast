name: Render original demo sample

on:
  workflow_dispatch:
  push:
    paths:
      - samples/transcript.txt
      - src/render_sample.py
      - .github/workflows/sample.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Diagnose live TTS with synthetic text and no user credentials
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          import tempfile
          import edge_tts
          import sys
          sys.path.insert(0, "src")
          import tts
          async def probe():
              with tempfile.TemporaryDirectory() as directory:
                  for mode in ("sdk_save", "bounded_stream"):
                      try:
                          voice = edge_tts.Communicate("An original public demonstration.", tts.VOICE)
                          path = Path(directory) / (mode + ".mp3")
                          operation = voice.save(str(path)) if mode == "sdk_save" else tts.save_audio(voice, path)
                          await asyncio.wait_for(operation, timeout=25)
                          print(mode, "audio bytes", path.stat().st_size)
                      except Exception as error:
                          print(mode, type(error).__name__, str(error))
          asyncio.run(probe())
          PY
      - run: python src/render_sample.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-demo
          path: |
            samples/demo.mp3
            samples/demo.json
          retention-days: 7

