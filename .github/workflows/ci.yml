name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            install_ffmpeg() {
              sudo timeout 90s apt-get "${apt_options[@]}" "$@" -o APT::Update::Error-Mode=any update &&
                sudo timeout 90s apt-get "${apt_options[@]}" "$@" install -y ffmpeg
            }
            if ! install_ffmpeg; then
              echo 'Retrying FFmpeg installation using the official Ubuntu archive.'
              ubuntu_sources="$RUNNER_TEMP/ffmpeg-ubuntu.sources"
              sed -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/sources.list.d/ubuntu.sources > "$ubuntu_sources"
              install_ffmpeg -o "Dir::Etc::sourcelist=$ubuntu_sources" -o Dir::Etc::sourceparts=-
            fi
          fi
          ffmpeg -version
          ffprobe -version
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Check dependency imports
        run: python -c "import google.genai, edge_tts, curl_cffi, bs4, cryptography.fernet"
