name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check dependency imports
        run: python -c "import google.genai, edge_tts, curl_cffi, bs4, cryptography.fernet"
