name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Check dependency imports
        run: python -c "import google.genai, edge_tts, curl_cffi, bs4, cryptography.fernet"
