{
  "name": "Synthetic pipeline failure alert check",
  "on": {
    "push": {
      "branches": [
        "fix/pipeline-generation-alerts"
      ],
      "paths": [
        ".github/workflows/monitor-probe.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "outputs": {
        "attempted_articles": "${{ steps.generation.outputs.attempted_articles }}",
        "created_articles": "${{ steps.generation.outputs.created_articles }}",
        "created_audio_files": "${{ steps.generation.outputs.created_audio_files }}",
        "failed_articles": "${{ steps.generation.outputs.failed_articles }}",
        "deferred_articles": "${{ steps.generation.outputs.deferred_articles }}",
        "skipped_articles": "${{ steps.generation.outputs.skipped_articles }}",
        "queued_articles": "${{ steps.generation.outputs.queued_articles }}",
        "due": "${{ steps.cadence.outputs.due }}"
      },
      "steps": [
        {
          "name": "Mark synthetic run due",
          "id": "cadence",
          "run": "echo \"due=true\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "run": "python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt"
        },
        {
          "name": "Simulate one successful article and one unrecovered generation error",
          "id": "generation",
          "run": "python - <<'PY'\nimport os, sys, tempfile\nfrom pathlib import Path\nsys.path.insert(0, 'tests')\nfrom test_monitoring import GenerationMonitoringTests\ncase = GenerationMonitoringTests()\nwith tempfile.TemporaryDirectory() as temporary:\n    root = Path(temporary)\n    result, counts, state = case.run_case(root, [None, RuntimeError('synthetic failure')])\n    assert result == 0 and counts['failed_articles'] == '1'\n    assert counts['created_audio_files'] == '1' and counts['queued_articles'] == '1'\n    assert len(state['retry']) == 1 and (root / 'site/episodes/new-0.mp3').exists()\n    assert (root / 'site/feed.xml').exists()\n    with open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n        for name, value in counts.items():\n            output.write(f'{name}={value}\\n')\n    print('SYNTHETIC_OUTPUT_AND_RETRY_SAVED: one successful article, one failed article.')\nPY"
        }
      ]
    },
    "publish": {
      "runs-on": "ubuntu-latest",
      "needs": "build",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Confirm publication remains eligible",
          "env": {
            "FAILED_ARTICLES": "${{ needs.build.outputs.failed_articles }}"
          },
          "run": "test \"$FAILED_ARTICLES\" = 1\nprintf \"%s\\n\" \"SYNTHETIC_PUBLICATION_SUCCESS: final health check has not blocked output.\""
        }
      ]
    },
    "health": {
      "needs": [
        "build",
        "publish"
      ],
      "if": "always() && needs.build.result != 'skipped' && (needs.build.result != 'success' || needs.build.outputs.due == 'true')",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "name": "Check generation health after output is saved or published",
          "env": {
            "BUILD_RESULT": "${{ needs.build.result }}",
            "PUBLISH_RESULT": "${{ needs.publish.result }}",
            "PUBLISH_TO_PAGES": "${{ vars.PUBLISH_TO_PAGES }}",
            "ATTEMPTED_ARTICLES": "${{ needs.build.outputs.attempted_articles }}",
            "CREATED_ARTICLES": "${{ needs.build.outputs.created_articles }}",
            "CREATED_AUDIO_FILES": "${{ needs.build.outputs.created_audio_files }}",
            "FAILED_ARTICLES": "${{ needs.build.outputs.failed_articles }}",
            "DEFERRED_ARTICLES": "${{ needs.build.outputs.deferred_articles }}",
            "SKIPPED_ARTICLES": "${{ needs.build.outputs.skipped_articles }}",
            "QUEUED_ARTICLES": "${{ needs.build.outputs.queued_articles }}"
          },
          "run": "python3 -I - <<'PYHEALTH'\nimport os, re, sys\nfrom pathlib import Path\ndef fail(message):\n    print('::error::' + message)\n    summary = os.environ.get('GITHUB_STEP_SUMMARY')\n    if summary:\n        with Path(summary).open('a', encoding='utf-8') as target:\n            target.write('## Podcast health\\n\\n' + message + '\\n')\n    sys.exit(1)\nif os.environ['BUILD_RESULT'] != 'success':\n    fail('Podcast build did not complete successfully; review the failed build step.')\nnames = ('ATTEMPTED_ARTICLES', 'CREATED_ARTICLES', 'CREATED_AUDIO_FILES', 'FAILED_ARTICLES',\n         'DEFERRED_ARTICLES', 'SKIPPED_ARTICLES', 'QUEUED_ARTICLES')\ncounts = {}\nfor name in names:\n    value = os.environ.get(name, '')\n    if not re.fullmatch(r'[0-9]{1,6}', value):\n        fail('Generation health report is missing or invalid; review the build job.')\n    counts[name] = int(value)\nsummary = os.environ.get('GITHUB_STEP_SUMMARY')\nif summary:\n    with Path(summary).open('a', encoding='utf-8') as target:\n        target.write('## Generation health\\n\\n| Result | Count |\\n| --- | --- |\\n')\n        for name, count in counts.items():\n            target.write(f\"| {name.replace('_', ' ').capitalize()} | {count} |\\n\")\nif os.environ['PUBLISH_TO_PAGES'] == 'true' and os.environ['PUBLISH_RESULT'] != 'success':\n    fail('Public podcast publication did not complete successfully; review the publisher job.')\nif counts['FAILED_ARTICLES']:\n    fail(f\"Episode generation failed for {counts['FAILED_ARTICLES']} article(s); \"\n         f\"{counts['CREATED_AUDIO_FILES']} new audio file(s) saved/published and \"\n         f\"{counts['QUEUED_ARTICLES']} article(s) waiting for retry.\")\nprint('Generation healthy: no unrecovered episode failures.')\nPYHEALTH\n"
        }
      ]
    }
  }
}
