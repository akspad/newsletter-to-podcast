name: Probe Substack reachability (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - shell: python
        run: |
          from curl_cffi import requests
          for u in ["https://substack.com/api/v1/subscriptions",
                    "https://newsletter.semianalysis.com/api/v1/archive?sort=new&limit=2",
                    "https://newsletter.semianalysis.com/feed",
                    "https://semianalysis.substack.com/api/v1/archive?sort=new&limit=2",
                    "https://www.astralcodexten.com/api/v1/archive?sort=new&limit=2",
                    "https://www.astralcodexten.com/feed"]:
              for imp in (None, "chrome"):
                  try:
                      r = requests.get(u, impersonate=imp, timeout=20, allow_redirects=True) if imp else requests.get(u, timeout=20, allow_redirects=True)
                      print(r.status_code, imp, r.headers.get("cf-mitigated"), u, r.text[:80].replace("\n"," "))
                  except Exception as e:
                      print("ERR", imp, u, e)
