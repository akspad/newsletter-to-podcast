name: Probe publication reachability (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - shell: python
        run: |
          import json
          from curl_cffi import requests
          for base in ["https://newsletter.doomberg.com", "https://doomberg.com", "https://www.doomberg.com", "https://doomberg.substack.com"]:
              for path in ["/api/v1/archive?sort=new&limit=6", "/feed"]:
                  u = base + path
                  try:
                      r = requests.get(u, impersonate="chrome", timeout=20, allow_redirects=True)
                      print(r.status_code, r.headers.get("cf-mitigated"), u, "->", r.url)
                      if r.status_code == 200 and "archive" in path:
                          for p in r.json():
                              print("   ", p["post_date"][:10], p.get("wordcount"), p.get("audience"), p["title"][:70])
                  except Exception as e:
                      print("ERR", u, e)
