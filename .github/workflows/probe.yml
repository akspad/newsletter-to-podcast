name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - shell: python
        run: |
          import re
          from curl_cffi import requests
          urls = ["https://www.generalcatalyst.com/news-and-content", "https://www.generalcatalyst.com/feed",
                  "https://www.generalcatalyst.com/rss.xml", "https://www.generalcatalyst.com/rss",
                  "https://www.generalcatalyst.com/stories", "https://www.generalcatalyst.com/perspectives",
                  "https://www.generalcatalyst.com/sitemap.xml", "https://www.generalcatalyst.com/robots.txt"]
          for u in urls:
              try:
                  r = requests.get(u, impersonate="chrome", timeout=30)
              except Exception as e:
                  print("ERR", u, e); continue
              t = r.text
              print(f"\n===== {r.status_code} {r.url} {r.headers.get('content-type')} {len(t)} bytes")
              print("feeds:", re.findall(r'<link[^>]+(?:rss|atom)[^>]*>', t)[:5])
              print("generator:", re.findall(r'<meta[^>]+generator[^>]*>', t)[:2], "next:", "__NEXT_DATA__" in t, "webflow:", "webflow" in t.lower())
              links = sorted(set(re.findall(r'href="(/[^"#?]+)"', t)))
              print("links:", links[:150])
              if "xml" in (r.headers.get("content-type") or "") or u.endswith(".txt"):
                  print(t[:3000])
          r = requests.get("https://www.generalcatalyst.com/news-and-content", impersonate="chrome", timeout=30)
          print("\n===== page text sample")
          print(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", re.sub(r"(?s)<(script|style).*?</\1>", "", r.text)))[:4000])
