name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q curl_cffi
      - shell: python
        run: |
          import re, json
          from curl_cffi import requests
          L = requests.get("https://www.generalcatalyst.com/stories", impersonate="chrome", timeout=30).text
          order = []
          for m in re.finditer(r'href="(/stories/[^"#?]+)"', L):
              if m.group(1) not in order: order.append(m.group(1))
          print("ORDER:", order)
          i = L.find(order[0]); print("AROUND FIRST LINK:", re.sub(r"\s+"," ",L[i-1500:i+1500]))
          print("DATES ON LISTING:", re.findall(r'>([A-Z][a-z]+ \d{1,2}, \d{4})<', L)[:40])
          for u in order[:3]:
              t = requests.get("https://www.generalcatalyst.com"+u, impersonate="chrome", timeout=30).text
              print("\n=====", u, len(t))
              print("META:", [m for m in re.findall(r'<meta[^>]+>', t) if re.search(r'(title|date|time|author|description)', m)])
              print("JSONLD:", [x[:800] for x in re.findall(r'(?s)<script[^>]+ld\+json[^>]*>(.*?)</script>', t)])
              print("TIME:", re.findall(r'<time[^>]*>[^<]*', t)[:5], "DATES:", re.findall(r'>([A-Z][a-z]+ \d{1,2}, \d{4})<', t)[:5])
              print("RICH:", [m.group(0)[:120] for m in re.finditer(r'<div[^>]+class="[^"]*(rich-text|w-richtext)[^"]*"', t)][:5])
              body = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", re.sub(r"(?s)<(script|style|nav|footer).*?</\1>", "", t)))
              print("WORDS:", len(body.split())); print(body[:2500])
