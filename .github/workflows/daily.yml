name: Newsletter podcast

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/daily.yml
  schedule:
    # Hourly checks; RUNS_PER_DAY controls podcast generation without editing cron.
    # The encrypted state allows one completed run per window, with retries after source outages.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Optional: process articles from this many past hours"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: newsletter-podcast
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      due: ${{ steps.cadence.outputs.due }}
      public_artifact_id: ${{ steps.public_upload.outputs.artifact-id }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    env:
      PUBLISH_TO_PAGES: ${{ vars.PUBLISH_TO_PAGES }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      EPISODE_MODE: ${{ vars.EPISODE_MODE || 'summary' }}
      MAX_EPISODE_MINUTES: ${{ vars.MAX_EPISODE_MINUTES || '5' }}
      MAX_SCRIPT_WORDS: ${{ vars.MAX_SCRIPT_WORDS || '700' }}
      MIN_WORDS: ${{ vars.MIN_WORDS || '1500' }}
      MAX_EPISODES_PER_RUN: ${{ vars.MAX_EPISODES_PER_RUN || '20' }}
      KEEP_EPISODES: ${{ vars.KEEP_EPISODES || '0' }}
      RUNS_PER_DAY: ${{ vars.RUNS_PER_DAY || '4' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewNeural' }}
      TTS_RATE: ${{ vars.TTS_RATE || '+0%' }}
      SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL || 'gemini-flash-latest' }}
      FEED_TITLE: ${{ vars.FEED_TITLE }}
      LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      VERBOSE: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate privacy and publication choice
        env:
          PUBLICATIONS: ${{ secrets.PUBLICATIONS || vars.PUBLICATIONS }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          if [ -z "$PUBLICATIONS" ]; then
            echo "::error::Set PUBLICATIONS first. This repository contains no subscription list."
            exit 1
          fi
          if [ "$REPOSITORY_PRIVATE" != "true" ] && [ "$PUBLISH_TO_PAGES" != "true" ]; then
            echo "::error::A public repository needs PUBLISH_TO_PAGES=true to explicitly publish its podcast."
            exit 1
          fi
          if [ "$PUBLISH_TO_PAGES" = "true" ] && [ -z "$STATE_ENCRYPTION_KEY" ]; then
            echo "::error::Add a STATE_ENCRYPTION_KEY secret to protect processing state between runs."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies without application secrets
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip check
      - name: Restore private output and processing state
        if: github.event.repository.private && vars.PUBLISH_TO_PAGES != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .state
            site
          key: podcast-private-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            podcast-private-
      - name: Restore public feed
        if: vars.PUBLISH_TO_PAGES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .state
          # A failed fetch must abort rather than silently replace an existing feed.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote --heads origin gh-pages > .state/published-ref
          if [ -s .state/published-ref ]; then
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch origin gh-pages
            mkdir -p site
            git archive FETCH_HEAD | tar -x -C site
            # Import legacy completed IDs/retries privately before removing plaintext output.
            if [ -f site/state.json ]; then
              mkdir -p .state
              mv site/state.json .state/legacy-state.json
            fi
          fi
      - name: Check configurable scheduling window
        id: cadence
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python src/schedule.py
      - name: Install audio tools when due
        if: steps.cadence.outputs.due == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build episodes
        if: steps.cadence.outputs.due == 'true'
        env:
          PUBLICATIONS: ${{ secrets.PUBLICATIONS || vars.PUBLICATIONS }}
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
          SUBSTACK_AUTH_HOSTS: ${{ secrets.SUBSTACK_AUTH_HOSTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python src/main.py
      - name: Save private output and processing state
        if: always() && steps.cadence.outputs.due == 'true' && github.event.repository.private && vars.PUBLISH_TO_PAGES != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .state
            site
          key: podcast-private-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Downloadable output (private repository only)
        if: steps.cadence.outputs.due == 'true' && github.event.repository.private && vars.PUBLISH_TO_PAGES != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newsletter-podcast
          path: |
            site/feed.xml
            site/episodes/*.mp3
          retention-days: 7
      - name: Prepare only public assets for publication
        if: steps.cadence.outputs.due == 'true' && vars.PUBLISH_TO_PAGES == 'true'
        id: bundle
        run: python src/publish_bundle.py site .state/published-ref public-bundle
      - name: Upload immutable public bundle
        if: steps.cadence.outputs.due == 'true' && vars.PUBLISH_TO_PAGES == 'true'
        id: public_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: podcast-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-bundle/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.due == 'true' && vars.PUBLISH_TO_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download this run's immutable public bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.public_artifact_id }}
          path: incoming
          merge-multiple: true
      - name: Verify digest and public asset allowlist
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
        run: |
          python3 -I - <<'PYVERIFY'
          import hashlib, os, re, tarfile
          from pathlib import Path
          archive = Path('incoming/podcast-public.tar')
          expected = os.environ['EXPECTED_SHA256']
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise ValueError('Invalid bundle digest')
          with archive.open('rb') as source:
              if hashlib.file_digest(source, 'sha256').hexdigest() != expected:
                  raise ValueError('Public bundle digest mismatch')
          head = Path('incoming/published-head.txt').read_text()
          if head and not re.fullmatch(r'[0-9a-f]{40}', head):
              raise ValueError('Invalid previous publication revision')
          required = {'feed.xml', 'index.html', 'favicon.svg', 'podcast-state.enc', 'demo/sample.mp3'}
          seen = set()
          destination = Path('publish')
          destination.mkdir()
          with tarfile.open(archive, 'r:') as bundle:
              for member in bundle:
                  name = member.name
                  allowed = name in required or re.fullmatch(r'episodes/[A-Za-z0-9][A-Za-z0-9._-]{0,250}\.mp3', name)
                  if not allowed or not member.isfile() or name in seen:
                      raise ValueError('Unexpected public bundle member')
                  seen.add(name)
              if not required <= seen:
                  raise ValueError('Public bundle is incomplete')
              bundle.extractall(destination, filter='data')
          print('Verified public bundle; no executable or private state files accepted.')
          PYVERIFY
      - name: Publish explicitly public feed to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          published_head=$(cat incoming/published-head.txt)
          cd publish
          git init -q -b gh-pages
          touch .nojekyll
          git add --all .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Publish podcast"
          git push "--force-with-lease=refs/heads/gh-pages:${published_head}" "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" gh-pages
