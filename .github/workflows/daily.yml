name: Newsletter podcast

on:
  push:
    branches: [main]
    paths:
      - src/tts.py
  schedule:
    # Hourly checks; RUNS_PER_DAY controls podcast generation without editing cron.
    # The encrypted state allows one completed run per window, with retries after source outages.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      publish_existing_only:
        description: "Deploy the saved gh-pages snapshot without generating episodes"
        type: boolean
        default: false
      published_revision:
        description: "Expected gh-pages commit for a deploy-only run"
        type: string
        required: false
      lookback_hours:
        description: "Optional: process articles from this many past hours"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: newsletter-podcast
  cancel-in-progress: false

jobs:
  build:
    if: "!inputs.publish_existing_only && (github.event_name == 'workflow_dispatch' || vars.ENABLE_AUTOMATION == 'true')"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      due: ${{ steps.cadence.outputs.due }}
      public_artifact_id: ${{ steps.public_upload.outputs.artifact-id }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
      attempted_articles: ${{ steps.generation.outputs.attempted_articles }}
      created_articles: ${{ steps.generation.outputs.created_articles }}
      created_audio_files: ${{ steps.generation.outputs.created_audio_files }}
      failed_articles: ${{ steps.generation.outputs.failed_articles }}
      deferred_articles: ${{ steps.generation.outputs.deferred_articles }}
      skipped_articles: ${{ steps.generation.outputs.skipped_articles }}
      queued_articles: ${{ steps.generation.outputs.queued_articles }}
    env:
      PUBLISH_TO_PAGES: ${{ vars.PUBLISH_TO_PAGES }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      EPISODE_MODE: ${{ vars.EPISODE_MODE || 'summary' }}
      MAX_EPISODE_MINUTES: ${{ vars.MAX_EPISODE_MINUTES || '10' }}
      MAX_SCRIPT_WORDS: ${{ vars.MAX_SCRIPT_WORDS || '700' }}
      MIN_WORDS: ${{ vars.MIN_WORDS || '1500' }}
      MAX_EPISODES_PER_RUN: ${{ vars.MAX_EPISODES_PER_RUN || '20' }}
      KEEP_EPISODES: ${{ vars.KEEP_EPISODES || '0' }}
      RUNS_PER_DAY: ${{ vars.RUNS_PER_DAY || '4' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewNeural' }}
      TTS_RATE: ${{ vars.TTS_RATE || '+0%' }}
      PREVIEW_API_URL: ${{ vars.PREVIEW_API_URL || (github.repository == 'akspad/newsletter-to-podcast' && 'https://newsletter-audio-preview.onrender.com/api/preview' || '') }}
      SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL || 'gemini-flash-latest' }}
      FEED_TITLE: ${{ vars.FEED_TITLE }}
      LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      VERBOSE: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate privacy and publication choice
        env:
          PUBLICATIONS: ${{ secrets.PUBLICATIONS || vars.PUBLICATIONS }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          if [ -z "$PUBLICATIONS" ]; then
            echo "::error::Set PUBLICATIONS first. This repository contains no subscription list."
            exit 1
          fi
          if [ "$REPOSITORY_PRIVATE" != "true" ] && [ "$PUBLISH_TO_PAGES" != "true" ]; then
            echo "::error::A public repository needs PUBLISH_TO_PAGES=true to explicitly publish its podcast."
            exit 1
          fi
          if [ "$PUBLISH_TO_PAGES" = "true" ] && [ -z "$STATE_ENCRYPTION_KEY" ]; then
            echo "::error::Add a STATE_ENCRYPTION_KEY secret to protect processing state between runs."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies without application secrets
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip check
      - name: Restore private output and processing state
        if: github.event.repository.private && vars.PUBLISH_TO_PAGES != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .state
            site
          key: podcast-private-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            podcast-private-
      - name: Restore public feed
        if: vars.PUBLISH_TO_PAGES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .state
          # A failed fetch must abort rather than silently replace an existing feed.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote --heads origin gh-pages > .state/published-ref
          if [ -s .state/published-ref ]; then
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch origin gh-pages
            mkdir -p site
            git archive FETCH_HEAD | tar -x -C site
            # Import legacy completed IDs/retries privately before removing plaintext output.
            if [ -f site/state.json ]; then
              mkdir -p .state
              mv site/state.json .state/legacy-state.json
            fi
          fi
      - name: Check configurable scheduling window
        id: cadence
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python src/schedule.py
      - name: Install audio tools when due
        if: steps.cadence.outputs.due == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Restore encrypted speech checkpoints
        if: steps.cadence.outputs.due == 'true' && vars.PUBLISH_TO_PAGES == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/speech-encrypted
          key: podcast-speech-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            podcast-speech-v1-
      - name: Build episodes
        id: generation
        if: steps.cadence.outputs.due == 'true'
        env:
          PUBLICATIONS: ${{ secrets.PUBLICATIONS || vars.PUBLICATIONS }}
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
          SUBSTACK_AUTH_HOSTS: ${{ secrets.SUBSTACK_AUTH_HOSTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python src/main.py
      - name: Save encrypted speech checkpoints even after generation failure
        if: always() && steps.generation.outcome != 'skipped' && steps.cadence.outputs.due == 'true' && vars.PUBLISH_TO_PAGES == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/speech-encrypted
          key: podcast-speech-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save private output and processing state
        if: always() && steps.cadence.outputs.due == 'true' && github.event.repository.private && vars.PUBLISH_TO_PAGES != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .state
            site
          key: podcast-private-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Downloadable output (private repository only)
        if: steps.cadence.outputs.due == 'true' && github.event.repository.private && vars.PUBLISH_TO_PAGES != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newsletter-podcast
          path: |
            site/feed.xml
            site/episodes/*.mp3
          retention-days: 7
      - name: Prepare only public assets for publication
        if: steps.cadence.outputs.due == 'true' && vars.PUBLISH_TO_PAGES == 'true'
        id: bundle
        run: python src/publish_bundle.py site .state/published-ref public-bundle
      - name: Upload immutable public bundle
        if: steps.cadence.outputs.due == 'true' && vars.PUBLISH_TO_PAGES == 'true'
        id: public_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: podcast-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-bundle/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.due == 'true' && vars.PUBLISH_TO_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.save_public.outputs.revision }}
    steps:
      - name: Download this run's immutable public bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.public_artifact_id }}
          path: incoming
          merge-multiple: true
      - name: Verify digest and public asset allowlist
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
        run: |
          python3 -I - <<'PYVERIFY'
          import hashlib, os, re, tarfile
          from pathlib import Path
          archive = Path('incoming/podcast-public.tar')
          expected = os.environ['EXPECTED_SHA256']
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise ValueError('Invalid bundle digest')
          with archive.open('rb') as source:
              if hashlib.file_digest(source, 'sha256').hexdigest() != expected:
                  raise ValueError('Public bundle digest mismatch')
          head = Path('incoming/published-head.txt').read_text()
          if head and not re.fullmatch(r'[0-9a-f]{40}', head):
              raise ValueError('Invalid previous publication revision')
          required = {'feed.xml', 'index.html', 'favicon.svg', 'preview.js', 'podcast-state.enc', 'demo/sample.mp3'}
          seen = set()
          destination = Path('publish')
          destination.mkdir()
          with tarfile.open(archive, 'r:') as bundle:
              for member in bundle:
                  name = member.name
                  allowed = name in required or re.fullmatch(r'episodes/[A-Za-z0-9][A-Za-z0-9._-]{0,250}\.mp3', name)
                  if not allowed or not member.isfile() or name in seen:
                      raise ValueError('Unexpected public bundle member')
                  seen.add(name)
              if not required <= seen:
                  raise ValueError('Public bundle is incomplete')
              bundle.extractall(destination, filter='data')
          print('Verified public bundle; only approved site assets and encrypted state accepted.')
          PYVERIFY
      - name: Publish explicitly public feed to gh-pages
        id: save_public
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          published_head=$(cat incoming/published-head.txt)
          cd publish
          git init -q -b gh-pages
          touch .nojekyll
          git add --all .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Publish podcast"
          git push "--force-with-lease=refs/heads/gh-pages:${published_head}" "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" gh-pages
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish_pages:
    needs: publish
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && vars.PUBLISH_TO_PAGES == 'true' &&
      (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing_only))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the saved public feed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/gh-pages
          path: published
          persist-credentials: false
      - name: Verify and export the saved public tree
        env:
          EXPECTED_REVISION: ${{ inputs.publish_existing_only && inputs.published_revision || needs.publish.outputs.revision }}
        run: |
          set -euo pipefail
          revision=$(git -C published rev-parse HEAD)
          if [[ ! "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ || "$revision" != "$EXPECTED_REVISION" ]]; then
            echo "::error::Saved publication revision does not match the requested revision."
            exit 1
          fi
          python3 -I - <<'PYVERIFY'
          import re, subprocess
          required = {'feed.xml', 'index.html', 'favicon.svg', 'preview.js', 'podcast-state.enc', 'demo/sample.mp3'}
          entries = subprocess.check_output(['git', '-C', 'published', 'ls-tree', '-rz', 'HEAD'])
          seen = set()
          for entry in entries.decode().split('\0')[:-1]:
              fields, path = entry.split('\t', 1)
              mode, kind, _ = fields.split()
              allowed = path in required or path == '.nojekyll' or re.fullmatch(
                  r'episodes/[A-Za-z0-9][A-Za-z0-9._-]{0,250}\.mp3', path)
              if mode != '100644' or kind != 'blob' or not allowed:
                  raise ValueError('Unexpected file in the saved public tree')
              seen.add(path)
          if not required <= seen:
              raise ValueError('Saved public tree is incomplete')
          PYVERIFY
          mkdir pages-site
          git -C published archive "$revision" | tar -x -C pages-site
          echo "Verified saved public revision $revision"
      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: pages-site
      - name: Deploy the verified site
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  health:
    needs: [build, publish, publish_pages]
    if: always() && needs.build.result != 'skipped' && (needs.build.result != 'success' || needs.build.outputs.due == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check generation health after output is saved or published
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PAGES_RESULT: ${{ needs.publish_pages.result }}
          PUBLISH_TO_PAGES: ${{ vars.PUBLISH_TO_PAGES }}
          ATTEMPTED_ARTICLES: ${{ needs.build.outputs.attempted_articles }}
          CREATED_ARTICLES: ${{ needs.build.outputs.created_articles }}
          CREATED_AUDIO_FILES: ${{ needs.build.outputs.created_audio_files }}
          FAILED_ARTICLES: ${{ needs.build.outputs.failed_articles }}
          DEFERRED_ARTICLES: ${{ needs.build.outputs.deferred_articles }}
          SKIPPED_ARTICLES: ${{ needs.build.outputs.skipped_articles }}
          QUEUED_ARTICLES: ${{ needs.build.outputs.queued_articles }}
        run: |
          python3 -I - <<'PYHEALTH'
          import os, re, sys
          from pathlib import Path
          def fail(message):
              print('::error::' + message)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with Path(summary).open('a', encoding='utf-8') as target:
                      target.write('## Podcast health\n\n' + message + '\n')
              sys.exit(1)
          if os.environ['BUILD_RESULT'] != 'success':
              fail('Podcast build did not complete successfully; review the failed build step.')
          names = ('ATTEMPTED_ARTICLES', 'CREATED_ARTICLES', 'CREATED_AUDIO_FILES', 'FAILED_ARTICLES',
                   'DEFERRED_ARTICLES', 'SKIPPED_ARTICLES', 'QUEUED_ARTICLES')
          counts = {}
          for name in names:
              value = os.environ.get(name, '')
              if not re.fullmatch(r'[0-9]{1,6}', value):
                  fail('Generation health report is missing or invalid; review the build job.')
              counts[name] = int(value)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with Path(summary).open('a', encoding='utf-8') as target:
                  target.write('## Generation health\n\n| Result | Count |\n| --- | --- |\n')
                  for name, count in counts.items():
                      target.write(f"| {name.replace('_', ' ').capitalize()} | {count} |\n")
          if os.environ['PUBLISH_TO_PAGES'] == 'true' and os.environ['PUBLISH_RESULT'] != 'success':
              fail('Public podcast publication did not complete successfully; review the publisher job.')
          if os.environ['PUBLISH_TO_PAGES'] == 'true' and os.environ['PAGES_RESULT'] != 'success':
              fail('GitHub Pages deployment did not complete successfully; review the Pages job.')
          if counts['FAILED_ARTICLES']:
              fail(f"Episode generation failed for {counts['FAILED_ARTICLES']} article(s); "
                   f"{counts['CREATED_AUDIO_FILES']} new audio file(s) saved/published and "
                   f"{counts['QUEUED_ARTICLES']} article(s) waiting for retry.")
          print('Generation healthy: no unrecovered episode failures.')
          PYHEALTH
