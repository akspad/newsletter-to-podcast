name: Narration split validation
on:
  push:
    branches: [codex/natural-narration-parts]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Live full narration with spoken titles and natural splits
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile
          from unittest.mock import patch
          import xml.etree.ElementTree as ET
          sys.path.insert(0, "src")
          import config
          import main
          import tts
          from substack import Substack
          
          class Source(Substack):
              def get(self, url, **kwargs):
                  return Path("samples/source.xml").read_text()
          
          source = Source("")
          pub = {"base": "https://example.com/sample.xml", "name": "Original sample", "mode": "full", "rss": True}
          post = source.recent_posts(pub)[0]
          _, body = source.post_text(pub, post)
          real_synthesize, real_join = tts.synthesize, tts.join_audio
          spoken, assembled = {}, []
          def synthesize(text, path, maximum):
              assert maximum is None
              seconds = real_synthesize(text, path, maximum)
              spoken[path] = text
              return seconds
          def join(paths, output, maximum=None):
              seconds = real_join(paths, output, maximum)
              if "-part-" in output.name:
                  assembled.append([spoken[path] for path in paths])
              return seconds
          
          with tempfile.TemporaryDirectory() as tmp, patch.dict(os.environ, {
              "SITE_DIR": str(Path(tmp) / "site"), "STATE_DIR": str(Path(tmp) / "state"),
              "SITE_URL": "https://example.com/podcast", "EPISODE_MODE": "full",
              "MAX_EPISODE_MINUTES": "0.5", "LOOKBACK_HOURS": "87600",
              "GITHUB_EVENT_NAME": "workflow_dispatch", "VERBOSE": "false",
          }):
              settings = config.Settings.from_env()
              with patch("tts.synthesize", side_effect=synthesize), patch("tts.join_audio", side_effect=join):
                  assert main.run(settings, [pub], source) == 0
              state = json.loads((settings.state_dir / "state.json").read_text())
              episodes = state["episodes"]
              assert len(episodes) >= 2 and not state["retry"]
              assert len(assembled) == len(episodes)
              for index, (texts, episode) in enumerate(zip(assembled, episodes), 1):
                  assert texts[0] == f"{post['title']}. Part {index} of {len(episodes)}."
                  assert texts[-1][-1] in ".!?", "Split should end after a complete sentence"
                  assert episode["description"] == body
                  assert 0 < episode["duration"] <= 30
              author = ", ".join(b.get("name", "") for b in post.get("publishedBylines", [])) or pub["name"]
              expected = f"{pub['name']}. By {author}.\n{body}"
              assert " ".join(t for group in assembled for t in group[1:]).split() == expected.split()
              def audio_hashes():
                  return {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in (settings.site / "episodes").glob("*.mp3")}
              before = audio_hashes()
              items = [ET.tostring(i) for i in ET.parse(settings.site / "feed.xml").findall("channel/item")]
              with patch("tts.synthesize_full", side_effect=AssertionError("Unexpected duplicate narration")):
                  assert main.run(settings, [pub], source) == 0
              assert audio_hashes() == before
              assert [ET.tostring(i) for i in ET.parse(settings.site / "feed.xml").findall("channel/item")] == items
              print(f"LIVE_SPLIT_OK parts={len(episodes)} seconds={sum(e['duration'] for e in episodes):.3f} max_part={max(e['duration'] for e in episodes):.3f} spoken_titles=true accurate_numbering=true sentence_endings=true full_text_preserved=true stable_rerun=true")
          PY
